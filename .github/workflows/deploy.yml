name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The site itself still has no build step. This installs the single
      # runtime dependency the Functions import (@netlify/blobs, used by the
      # visitor counter) so esbuild can resolve it while bundling. Without it
      # `netlify deploy` bundles a broken /api/visits and the counter silently
      # falls back to its floor value.
      - name: Install function dependencies
        run: npm ci

      - name: Deploy to Netlify (production)
        run: npx --yes netlify-cli@17 deploy --dir=. --prod --message "CI deploy ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
