# Apolaki marketing site — static, no build step.
# `publish = "."` serves the repo root, so every non-dotfile here is public.
[build]
  publish = "."

# ── Canonicalize the host ──────────────────────────────────────────────────
# 301 the raw Netlify alias to the primary domain so the two never serve
# duplicate content. Deploy previews use a different host, so they're
# unaffected and stay on their own URL.
[[redirects]]
  from = "https://apolaki-ph.netlify.app/*"
  to = "https://apolaki.ai/:splat"
  status = 301
  force = true

# ── Security + privacy headers ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # CSP = default-deny allowlist, derived from an audit of Josa's pages:
    #   images → self + data: + Pexels (hotlinked photos); fonts/css → self;
    #   script/style → self + inline; form → self + apolaki-478302.web.app (bill-bar GET);
    #   no fetch/XHR, iframes, video, or audio.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://images.pexels.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self' https://apolaki-478302.web.app; base-uri 'self'; frame-ancestors 'self'; object-src 'none'"

# ── Caching (files are not fingerprinted) ──────────────────────────────────
# Fonts + images: safe to cache a week.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
# CSS + JS: revalidate so edits go live on the next deploy.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
