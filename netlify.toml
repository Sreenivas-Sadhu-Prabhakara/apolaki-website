# Apolaki marketing site — static, no build step
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Canonicalize the host: 301 the raw Netlify subdomain to the primary domain
# (prevents apolaki-ph.netlify.app from serving duplicate content vs apolaki.ai)
[[redirects]]
  from = "https://apolaki-ph.netlify.app/*"
  to = "https://apolaki.ai/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*/"
  to = "/blog/:splat.html"
  status = 301

# `publish = "."` uploads the whole repo root, so every non-dotfile is served:
# function sources, the ops runbook, build tooling. Confirmed live before these
# rules existed — /netlify/functions/chat.mjs returned 200.
#
# `force = true` is REQUIRED and is the whole point. Netlify's redirect engine
# shadows an unforced rule whenever a real file exists at that path — which is
# exactly the set of paths these rules target, so without force they are no-ops
# that quietly do nothing. This was caught in review after being written
# unforced the first time.
#
# The leading slash is literal: Netlify's own runtime lives under /.netlify/
# (leading dot) and is not matched here, so /api/chat and /api/visits are
# unaffected.
#
# This is a blocklist, which means it has to be extended whenever a new
# non-public directory is added. The durable fix is to publish from a staged
# directory instead of the repo root — see docs/superpowers/specs/.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Cloudflare Pages adapters. Harmless in themselves, but no reason to publish.
[[redirects]]
  from = "/functions/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Security + privacy headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'"

# Images/fonts: cache a week (not content-hashed, so don't go immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS/JS: revalidate so edits go live on next deploy (files aren't fingerprinted)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
